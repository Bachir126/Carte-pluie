name: Carte de pluie hebdomadaire

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  carte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install cartopy rasterio geopandas requests matplotlib

      - uses: actions/cache@v4
        with:
          path: chirps_data
          key: chirps-${{ github.run_id }}
          restore-keys: chirps-

      - run: python carte_pluie_auto.py

      - name: Enregistrer la carte dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cartes/
          git commit -m "Carte de pluie mise à jour" || echo "Rien à enregistrer"
          git push
